<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>art — общий холст shpateil</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css?v=12">
<script src="/static/lucide.min.js?v=1"></script>
</head>
<body>

<div class="wrap">

  <header class="hd">
    <div class="brand">
      <span class="cur">$</span><b>art</b><span class="mut dot">.</span><span class="mut">shpateil</span>
    </div>
    <div class="sp"></div>
    <div class="stat">
      <span class="idn"><i data-lucide="users"></i><b id="oncnt">0</b></span>
      <span class="idn"><i data-lucide="pencil"></i><b id="cnt">0</b></span>
      <span class="net bad" id="net">переподключение</span>
    </div>
    <button class="ib" id="adminbtn" title="админ-панель" hidden>
      <i data-lucide="shield"></i>
    </button>
    <button class="ib" id="undo" title="отменить (ctrl+z)"><i data-lucide="undo-2"></i></button>
    <button class="ib" id="logout" title="выйти"><i data-lucide="log-out"></i></button>
  </header>

  <div class="bar">
    <div class="who-row">
      <b id="wdot"></b>
      <span id="who">гость</span>
      <span class="mut">сейчас на холсте:</span>
      <span id="online" class="online"></span>
    </div>
  </div>

  <div class="main">

    <aside class="tools">
      <div id="tools" class="toolgrid"></div>

      <div class="grp">
        <div class="lbl">цвет</div>
        <div id="swatches" class="swrow"></div>
      </div>

      <div class="grp" id="szgrp">
        <div class="lbl">толщина <b id="sizeval">6px</b></div>
        <input type="range" id="sz" min="1" max="60" value="6">
      </div>

      <div class="grp" id="tszgrp" hidden>
        <div class="lbl">размер текста <b id="textsizeval">28px</b></div>
        <input type="range" id="tsz" min="8" max="160" value="28">
      </div>
    </aside>

    <div class="stage">
      <canvas id="cv"></canvas>

      <!-- уменьшенный весь холст с рамкой текущего обзора -->
      <div class="mini" id="mini" title="клик и протягивание переносят обзор">
        <canvas id="mcv"></canvas>
      </div>

      <!-- масштаб -->
      <div class="zoombar">
        <button class="ib" id="zout" title="отдалить"><i data-lucide="zoom-out"></i></button>
        <button class="ib" id="zin" title="приблизить"><i data-lucide="zoom-in"></i></button>
      </div>
    </div>

  </div>
</div>

<!-- вход и регистрация -->
<div class="gate" id="gate">
  <div class="gbox">
    <button class="ib gclose" id="gclose"><i data-lucide="x"></i></button>
    <h2 id="gtitle">вход</h2>
    <p class="mut" id="gsub">введи логин и пароль</p>
    <input id="glogin" placeholder="логин" autocomplete="username" spellcheck="false">
    <input id="gpw" type="password" placeholder="пароль" autocomplete="current-password">
    <div class="err" id="gerr"></div>
    <button class="btn primary" id="gsend">войти</button>
    <button class="btn" id="greg">регистрация</button>
  </div>
</div>

<!-- админ-панель -->
<aside class="panel" id="panel">
  <div class="phd">
    <h2>админ-панель</h2>
    <div class="sp"></div>
    <button class="ib" id="pclose"><i data-lucide="x"></i></button>
  </div>
  <div class="tabs" id="ptabs">
    <button class="on" data-t="hist">кто что рисовал</button>
    <button data-t="users">люди</button>
  </div>
  <div class="plist" id="hlist"></div>
  <div class="plist" id="ulist" hidden></div>
  <button class="btn danger" id="pclear">стереть весь холст</button>
</aside>

<div class="toast" id="toast"></div>

<script src="/static/app.js?v=17"></script>
<script>lucide.createIcons();</script>
</body>
</html>
